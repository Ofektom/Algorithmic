<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Starting up · Algorithmic</title>
<meta name="theme-color" content="#4c5bd4">
<!-- Shown by the service worker while the server wakes from sleep. Self-contained: no server needed. -->
<style>
  :root { --bg: #f6f7fb; --text: #1d2130; --muted: #6b7183; --brand: #4c5bd4; --track: #e1e4ec; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f1117; --text: #e8eaf2; --muted: #9aa1b5; --brand: #6b77ee; --track: #2a2f3d; } }
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
         background: var(--bg); color: var(--text); font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; }
  .box { max-width: 360px; }
  .logo { width: 56px; height: 56px; border-radius: 16px; background: var(--brand); color: #fff; font-weight: 800; font-size: 26px;
          display: inline-flex; align-items: center; justify-content: center; margin-bottom: 20px; }
  h1 { font-size: 20px; margin-bottom: 8px; }
  p { color: var(--muted); line-height: 1.5; font-size: 15px; }
  .bar { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; margin: 22px 0 10px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--brand); border-radius: 3px; transition: width 1s linear; }
  .small { font-size: 13px; }
  button { margin-top: 18px; height: 44px; padding: 0 18px; border-radius: 12px; border: 1.5px solid var(--track); background: transparent; color: var(--text); font: inherit; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<div class="box" role="status" aria-live="polite">
  <div class="logo">A</div>
  <h1 id="title">Waking up the server…</h1>
  <p id="text">The free server sleeps when nobody has used it for a while. It usually takes under a minute to start. This page opens by itself when it's ready.</p>
  <div class="bar"><i id="bar"></i></div>
  <p class="small" id="elapsed">0 s</p>
  <button type="button" id="retry" hidden>Try again</button>
</div>
<script>
  // Poll the real server (the service worker never answers ?__wake from cache), then reload this URL
  var started = Date.now();
  var EXPECTED_S = 60, GIVE_UP_S = 180;
  var timer = null;
  function tick() {
    var s = Math.round((Date.now() - started) / 1000);
    document.getElementById('elapsed').textContent = s + ' s';
    document.getElementById('bar').style.width = Math.min(95, 100 * s / EXPECTED_S) + '%';
    if (s >= GIVE_UP_S) {
      clearInterval(timer);
      document.getElementById('title').textContent = 'The server is taking longer than usual';
      document.getElementById('text').textContent = 'Check your connection, then try again.';
      document.getElementById('retry').hidden = false;
      return;
    }
    if (!navigator.onLine) {
      document.getElementById('title').textContent = "You're offline";
      document.getElementById('text').textContent = 'This opens by itself when you reconnect.';
      return;
    }
    fetch('/manifest.json?__wake=' + Date.now(), { cache: 'no-store' })
      .then(function(r) { if (r.ok) { clearInterval(timer); location.reload(); } })
      .catch(function() { /* still asleep */ });
  }
  document.getElementById('retry').addEventListener('click', function() { location.reload(); });
  timer = setInterval(tick, 3000);
  tick();
</script>
</body>
</html>
