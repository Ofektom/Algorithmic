<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Algorithmic: ask a coding problem by voice or text and see its Java solution">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Algorithmic">
    <title>Algorithmic</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <meta name="theme-color" content="#4c5bd4">
    <link rel="preconnect" href="https://algorithmicx.onrender.com" crossorigin>
    <!-- Apply the saved theme before first paint so dark mode doesn't flash white -->
    <script>
        try {
            var t = localStorage.getItem('algo.theme');
            if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        } catch (e) { /* storage unavailable */ }
    </script>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body data-nav="home">
<main class="page">
    <div class="appbar mobile-only"><div class="brand-row"><span class="logo">A</span><span>Algorithmic</span></div></div>

    <h1 class="hero-title">What do you want to solve?</h1>
    <p class="lead">Tap <b>Ask</b> and say it, or type it here.</p>

    <div class="search">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M10 3a7 7 0 0 1 5.6 11.2l5.1 5.1-1.4 1.4-5.1-5.1A7 7 0 1 1 10 3zm0 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10z"/></svg>
        <input type="search" id="searchInput" placeholder="Type a problem, e.g. “two sum”"
               aria-label="Problem or question" enterkeyhint="search" autocomplete="off">
        <button type="button" class="go" data-search-go>Go</button>
    </div>

    <div class="chips" id="recentChips" style="margin-top:12px" hidden></div>

    <section id="continueSection" hidden>
        <h2 class="h2">Continue</h2>
        <a class="row-link" id="continueLink" href="/">
            <span class="ico" aria-hidden="true">▶</span>
            <div class="grow"><div class="t" id="continueTitle"></div><div class="st" id="continueMeta"></div></div>
            <span class="chev">›</span>
        </a>
    </section>

    <h2 class="h2"><span>Categories</span><a href="/browse" id="seeAll">See all</a></h2>
    <div class="grid2 wide" id="categoryGrid">
        <div class="tile skel-tile" aria-hidden="true"></div>
        <div class="tile skel-tile" aria-hidden="true"></div>
        <div class="tile skel-tile" aria-hidden="true"></div>
        <div class="tile skel-tile" aria-hidden="true"></div>
        <div class="tile skel-tile" aria-hidden="true"></div>
        <div class="tile skel-tile" aria-hidden="true"></div>
        <div class="tile skel-tile" aria-hidden="true"></div>
        <div class="tile skel-tile" aria-hidden="true"></div>
    </div>
</main>

<script src="/js/config.js"></script>
<script src="/js/app.js"></script>
<script src="/js/voice.js"></script>
<script src="/js/pages/index.js"></script>
</body>
</html>
