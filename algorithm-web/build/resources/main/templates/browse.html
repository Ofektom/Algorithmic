<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Browse · Algorithmic')}"></head>
<body>
<main class="page">
    <div class="appbar"><h1>Browse</h1></div>

    <div class="search compact">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M10 3a7 7 0 0 1 5.6 11.2l5.1 5.1-1.4 1.4-5.1-5.1A7 7 0 1 1 10 3zm0 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10z"/></svg>
        <input type="search" id="searchInput" placeholder="Search all problems…" aria-label="Search problems"
               enterkeyhint="search" autocomplete="off">
        <button type="button" class="go" data-search-go>Go</button>
    </div>

    <h2 class="h2" th:text="${#lists.size(categories) + ' categories'}">Categories</h2>
    <div class="grid2 wide">
        <a th:each="category : ${categories}" class="tile"
           th:href="@{/category/{cat}(cat=${category})}" th:attr="data-category=${category}">
            <span class="ico" aria-hidden="true" th:text="${#strings.substring(category, 0, 1)}">A</span>
            <span class="t" th:text="${category}">Category</span>
            <span class="st"><span th:text="${categoryCounts.get(category) + (categoryCounts.get(category) == 1 ? ' problem' : ' problems')}"></span><span class="tile-ran"></span></span>
            <span class="bar"><i></i></span>
        </a>
    </div>
</main>

<nav th:replace="~{fragments/layout :: nav('browse')}"></nav>

<script th:inline="javascript">
    const categoryProblems = /*[[${categoryProblems}]]*/ {};
</script>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script>
    (function() {
        const ran = Store.ran();
        document.querySelectorAll('[data-category]').forEach(function(tile) {
            const names = categoryProblems[tile.dataset.category] || [];
            const done = names.filter(function(n) { return ran.indexOf(n) !== -1; }).length;
            if (names.length) tile.querySelector('.bar i').style.width = Math.round(100 * done / names.length) + '%';
            if (done) tile.querySelector('.tile-ran').textContent = ' · ' + done + ' ran';
        });
    })();
</script>
</body>
</html>
