<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Algorithmic')}"></head>
<body>
<main class="page">
    <div class="appbar mobile-only"><div class="brand-row"><span class="logo">A</span><span>Algorithmic</span></div></div>

    <h1 class="hero-title">What do you want to solve?</h1>
    <p class="lead">Tap <b>Ask</b> and say it, or type it here.</p>

    <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3a7 7 0 0 1 5.6 11.2l5.1 5.1-1.4 1.4-5.1-5.1A7 7 0 1 1 10 3zm0 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10z"/></svg>
        <input type="search" id="searchInput" placeholder="Type a problem, e.g. “two sum”"
               aria-label="Problem or question" enterkeyhint="search" autocomplete="off">
        <button type="button" class="go" data-search-go>Go</button>
    </div>

    <div class="chips" id="recentChips" style="margin-top:12px" hidden></div>

    <section id="continueSection" hidden>
        <h2 class="h2">Continue</h2>
        <a class="row-link" id="continueLink" href="#">
            <span class="ico" aria-hidden="true">▶</span>
            <div class="grow"><div class="t" id="continueTitle"></div><div class="st" id="continueMeta"></div></div>
            <span class="chev">›</span>
        </a>
    </section>

    <h2 class="h2"><span>Categories</span><a href="/browse" th:text="${'See all ' + #lists.size(categories)}">See all</a></h2>
    <div class="grid2 wide">
        <a th:each="category, st : ${categories}" th:if="${st.index < 8}" class="tile"
           th:href="@{/category/{cat}(cat=${category})}" th:attr="data-category=${category}">
            <span class="ico" aria-hidden="true" th:text="${#strings.substring(category, 0, 1)}">A</span>
            <span class="t" th:text="${category}">Category</span>
            <span class="st"><span class="tile-count" th:text="${categoryCounts.get(category) + (categoryCounts.get(category) == 1 ? ' problem' : ' problems')}"></span><span class="tile-ran"></span></span>
            <span class="bar"><i></i></span>
        </a>
    </div>
</main>

<nav th:replace="~{fragments/layout :: nav('home')}"></nav>

<script th:inline="javascript">
    const categoryProblems = /*[[${categoryProblems}]]*/ {};
</script>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script>
    // Recent searches, "Continue" and category progress all come from this browser's history
    (function() {
        const history = Store.history();
        const ran = Store.ran();

        const chips = document.getElementById('recentChips');
        history.slice(0, 4).forEach(function(entry) {
            const a = document.createElement('a');
            a.className = 'chip';
            a.href = entry.url;
            a.textContent = entry.title;
            chips.appendChild(a);
        });
        chips.hidden = history.length === 0;

        if (history.length) {
            const last = history[0];
            document.getElementById('continueLink').href = last.url;
            document.getElementById('continueTitle').textContent = last.title;
            document.getElementById('continueMeta').textContent =
                (last.type === 'generated' ? 'Generated solution' : (last.category || 'Built-in')) + ' · ' + timeAgo(last.ts);
            document.getElementById('continueSection').hidden = false;
        }

        document.querySelectorAll('[data-category]').forEach(function(tile) {
            const names = categoryProblems[tile.dataset.category] || [];
            const done = names.filter(function(n) { return ran.indexOf(n) !== -1; }).length;
            if (names.length) tile.querySelector('.bar i').style.width = Math.round(100 * done / names.length) + '%';
            if (done) tile.querySelector('.tile-ran').textContent = ' · ' + done + ' ran';
        });
    })();
</script>
</body>
</html>
