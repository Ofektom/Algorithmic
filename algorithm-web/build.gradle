plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.0'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.algorithm'
version = '1.0.0'

java {
    sourceCompatibility = '21'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation project(':algorithm-core')

    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

jar {
    enabled = false
}

bootJar {
    archiveBaseName = 'algorithm-web'
    archiveVersion = '1.0.0'
}

test {
    useJUnitPlatform()
}

// Problem catalogue + solution code as JSON for the static site on Vercel (web/data)
tasks.register('exportStaticData', JavaExec) {
    description = 'Exports the problem catalogue and method source code to web/data for the static site'
    group = 'build'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.algorithm.web.export.StaticDataExport'
    workingDir = rootProject.projectDir
    args = [rootProject.file('web/data').absolutePath]
}
