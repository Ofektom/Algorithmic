<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Algorithmic">
    <title>Search Results</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" th:href="@{/favicon.ico}">
    <link rel="manifest" href="/manifest.json" th:href="@{/manifest.json}">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <a href="/" class="back-link">← Back</a>
            <h1>Search Results for: <span th:text="${query}"></span></h1>
        </header>
        
        <div class="problems-list">
            <div th:each="problem : ${results}" class="problem-card">
                <a th:href="@{/problem/{name}(name=${problem.name})}">
                    <h3 th:text="${problem.name}"></h3>
                    <p th:text="${problem.shortDescription}"></p>
                </a>
            </div>
            
            <!-- AI Fallback - shown only when no built-in results -->
            <div th:if="${#lists.isEmpty(results)}" class="no-results ai-fallback">
                <p>No built-in algorithms found for "<span th:text="${query}"></span>".</p>
                <p>Generating AI solution with Groq...</p>
                
                <div id="aiLoading" style="text-align:center; padding: 20px;">
                    <h3>Loading AI response...</h3>
                </div>
                
                <div id="aiResult" style="display:none; margin-top: 20px;">
                    <h3>AI Explanation</h3>
                    <p id="aiExplanation"></p>
                    
                    <h3>Step-by-Step Solution</h3>
                    <p id="aiSolution"></p>
                    
                    <h3>Java Code</h3>
                    <pre class="algorithm-code" id="aiCode"></pre>
                </div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', () => {
            const noResults = /*[[${#lists.isEmpty(results)}]]*/ false;
            const query = /*[[${query}]]*/ '';

            if (noResults && query.trim()) {
                fetchAIResult(query);
            }
        });

        async function fetchAIResult(query) {
            try {
                const response = await fetch('/api/ai/solution?' + new URLSearchParams({
                    problemStatement: query,
                    language: 'Java'
                }));

                if (!response.ok) {
                    throw new Error('Failed to get AI solution');
                }

                const data = await response.json();

                document.getElementById('aiLoading').style.display = 'none';
                document.getElementById('aiResult').style.display = 'block';

                document.getElementById('aiExplanation').textContent = data.explanation || 'No explanation available';
                document.getElementById('aiSolution').textContent = data.solution || 'No solution provided';
                document.getElementById('aiCode').textContent = data.code || '// No code generated by AI';
            } catch (err) {
                document.getElementById('aiLoading').innerHTML = '<h3>Error</h3><p>' + err.message + '</p>';
            }
        }
    </script>

    <script src="/js/app.js" th:src="@{/js/app.js}"></script>
    <script src="/js/voice.js"></script>
</body>
</html>
