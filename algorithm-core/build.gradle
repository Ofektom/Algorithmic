plugins {
    id 'java-library'
}

group = 'com.algorithm'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    // Optional if you prefer legacy flags
    // sourceCompatibility = JavaVersion.VERSION_17
    // targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    // Core module has no external dependencies - pure Java algorithms
}