# Keeps the static site's data (web/data) in step with the Java problem registry and solutions.
# On a push that changes them, it re-exports the JSON and commits it, which Vercel then deploys.
name: Export static data

on:
  push:
    paths:
      - 'algorithm-core/src/**'
      - 'algorithm-web/src/**'
      - 'algorithm-web/build.gradle'
      - '.github/workflows/export-data.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: export-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Export catalogue and code
        run: |
          chmod +x gradlew
          ./gradlew :algorithm-web:exportStaticData --no-daemon

      - name: Commit if changed
        run: |
          git add -A web/data
          if git diff --cached --quiet; then
            echo "web/data is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update static site data"
          git push
