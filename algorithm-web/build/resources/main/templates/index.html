<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Algorithm Testing System - Test and learn coding interview algorithms with voice navigation">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Algorithmic">
    <title>Algorithmic</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" th:href="@{/favicon.ico}">
    <link rel="manifest" href="/manifest.json" th:href="@{/manifest.json}">
    <meta name="theme-color" content="#667eea">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <header class="hero">
            <h1>🧮 Algorithmic</h1>
            <p>Type or say a problem to see its solution</p>
        </header>
        
        <div class="search-bar">
            <input type="search" id="searchInput" placeholder="Type a problem or question…"
                   aria-label="Problem or question" enterkeyhint="search" autocomplete="off">
            <button type="button" onclick="search()">Go</button>
        </div>
        
        <div class="categories-grid">
            <div th:each="category : ${categories}" class="category-card">
                <a th:href="@{/category/{cat}(cat=${category})}">
                    <h3 th:text="${category}"></h3>
                    <span class="category-count"
                          th:text="${categoryCounts.get(category) + (categoryCounts.get(category) == 1 ? ' problem' : ' problems')}"></span>
                </a>
            </div>
        </div>
    </div>
    
    <!-- Floating Voice Button (behaviour in voice.js) -->
    <button id="voiceButton" class="voice-button" type="button">🎤</button>

    <script src="/js/app.js" th:src="@{/js/app.js}"></script>
    <script src="/js/voice.js"></script>

</body>
</html>
