<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!-- Result of the form POST to /execute. The problem page now runs in place; this stays for old links and no-JavaScript use. -->
<head th:replace="~{fragments/layout :: head('Result · Algorithmic')}"></head>
<body>
<main class="page">
    <div class="appbar">
        <a th:href="${problemName != null} ? @{/problem/{name}(name=${problemName},tab='run')} : @{/}" class="icon-btn" aria-label="Back">←</a>
        <h1 th:text="${problemName != null ? problemName : 'Result'}">Result</h1>
    </div>

    <div th:if="${methodName != null or success != null or error != null}">
        <div class="source-row" th:if="${problemName != null}"><span class="source">Built-in solution</span></div>

        <section class="card result" th:if="${success == true}">
            <div class="result-head"><span class="badge ok">✓ Success</span><span class="small muted" th:text="${methodName}"></span></div>
            <p class="value" th:text="${result}"></p>
        </section>

        <section class="card result" th:if="${success == false}">
            <div class="result-head"><span class="badge err">Error</span></div>
            <p class="error-text" th:text="${error != null ? error : 'An unknown error occurred'}"></p>
        </section>

        <section th:if="${methodSourceCode != null and !#strings.isEmpty(methodSourceCode)}">
            <h2 class="h2">Solution</h2>
            <pre class="code" th:text="${methodSourceCode}"></pre>
        </section>

        <div class="btn-row">
            <a th:href="@{/problem/{name}(name=${problemName},tab='run')}" class="btn primary" th:if="${problemName != null}">Try other inputs</a>
            <a th:href="@{/category/{cat}(cat=${category})}" class="btn secondary" th:if="${category != null}" th:text="${'More ' + category}">More problems</a>
        </div>
    </div>

    <!-- Opened directly (e.g. refresh after the one-time result was shown) -->
    <div class="empty" th:if="${methodName == null and success == null and error == null}">
        <p class="t">No result to show</p>
        <p>Run a problem first to see its result here.</p>
        <p style="margin-top:12px"><a href="/" class="btn primary">Go home</a></p>
    </div>
</main>

<nav th:replace="~{fragments/layout :: nav('browse')}"></nav>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
