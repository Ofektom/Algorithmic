# Server
server.port=${PORT:8086}
spring.application.name=algorithm-web

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# H2 Database (in-memory, optional for future features)
spring.datasource.url=jdbc:h2:mem:algorithmdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Groq API Configuration (for AI fallback feature)
# These MUST be set as environment variables in production (Render dashboard)
# For local development, set these as environment variables or use a local application-local.properties file
groq.api.key=${GROQ_API_KEY}
groq.api.url=${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
groq.api.model=${GROQ_MODEL:llama-3.1-8b-instant}

# Logging
logging.level.com.algorithm=DEBUG
