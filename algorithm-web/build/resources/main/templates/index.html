<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Algorithm Testing System - Test and learn LeetCode-style algorithms with voice navigation">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Algorithmic">
    <title>Algorithmic</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" th:href="@{/favicon.ico}">
    <link rel="manifest" href="/manifest.json" th:href="@{/manifest.json}">
    <meta name="theme-color" content="#6366f1">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🧮 Algorithmic</h1>
            <p>Test, learn, and solve algorithms interactively — now with voice commands!</p>
        </header>
        
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search algorithms or say 'solve two sum'...">
            <button onclick="search()">Search</button>
        </div>
        
        <div class="categories-grid">
            <div th:each="category : ${categories}" class="category-card">
                <a th:href="@{/category/{cat}(cat=${category})}">
                    <h3 th:text="${category}"></h3>
                </a>
            </div>
        </div>
    </div>
    
    <!-- Floating Voice Button -->
    <button id="voiceButton" class="voice-button" 
            title="Click or tap to start voice navigation (say 'solve two sum', 'show merge intervals', etc.)" 
            aria-label="Start voice navigation">
        🎤
    </button>

    <!-- Expose problem data for voice.js -->
    <script th:inline="javascript">
      window.PROBLEMS = /*[[${problemsJson}]]*/ [];
      window.CATEGORIES = /*[[${categoriesJson}]]*/ [];
    </script>

    <!-- Voice support check -->
    <script>
      (function(){
        const btn = document.getElementById('voiceButton');
        if (!btn) return;

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          btn.title = 'Voice navigation not supported in this browser';
          btn.style.opacity = '0.5';
          btn.disabled = true;
          btn.innerHTML = '🎤 ×';
        } else {
          btn.addEventListener('click', function gestureUnlock() {
            btn.removeEventListener('click', gestureUnlock);
          }, { once: true });
        }
      })();
    </script>

    <script src="/js/app.js" th:src="@{/js/app.js}"></script>
    <script src="/js/voice.js"></script>

    <!-- Simple search redirect -->
    <script>
      function search() {
          const query = document.getElementById('searchInput').value.trim();
          if (query) {
              window.location.href = '/search?q=' + encodeURIComponent(query);
          }
      }
    </script>
</body>
</html>
