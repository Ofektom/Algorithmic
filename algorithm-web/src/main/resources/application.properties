# Server
server.port=${PORT:8080}
spring.application.name=algorithm-web

# Static files get a content hash in their URL (style-<hash>.css via th:href/th:src), so every deploy
# loads the new CSS/JS instead of a copy a browser or the service worker cached from an older deploy
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/css/**,/js/**

# Browser origins allowed to call /api/** (the static site on Vercel and local testing).
# Override with CORS_ALLOWED_ORIGINS, e.g. https://algorithmic.vercel.app,https://your-domain.com
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://*.vercel.app,http://localhost:[*],http://127.0.0.1:[*]}

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Generated answers can take a while: Claude Code (up to 120s) then Groq (40s) on fallback.
# Keep this above both so failures are reported, not 503s.
spring.mvc.async.request-timeout=180s

# Claude Code engine: used automatically when the `claude` CLI is installed and signed in with a
# claude.ai subscription on the machine running the app (your own computer). Elsewhere, Groq is used.
solution.claude-code.enabled=${CLAUDE_CODE_ENABLED:true}
solution.claude-code.command=${CLAUDE_CODE_COMMAND:claude}
solution.claude-code.timeout-seconds=120

# Optional access check: when set, every page needs this password (any username). Set it on your
# private copy; leave unset on the public site.
app.access.password=${APP_ACCESS_PASSWORD:}

# Owner-only list of questions the built-in library couldn't answer: /insights?key=<this value>.
# Leave unset to turn the page off; misses are still written to the log as "Unmatched question".
app.insights.key=${INSIGHTS_KEY:}

# Groq API Configuration (for AI fallback feature)
# These MUST be set as environment variables in production (Render dashboard)
# For local development, set these as environment variables or use a local application-local.properties file
groq.api.key=${GROQ_API_KEY}
groq.api.url=${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
groq.api.model=${GROQ_MODEL:llama-3.3-70b-versatile}

# Logging
logging.level.com.algorithm=DEBUG
