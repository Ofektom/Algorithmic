<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Algorithmic">
    <title>Search Results</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" th:href="@{/favicon.ico}">
    <link rel="manifest" href="/manifest.json" th:href="@{/manifest.json}">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <a href="/" class="back-link">← Back</a>
            <h1>Search Results for: <span th:text="${query}"></span></h1>
        </header>
        
        <div class="problems-list">
            <div th:each="problem : ${results}" class="problem-card">
                <a th:href="@{/problem/{name}(name=${problem.name})}">
                    <h3 th:text="${problem.name}"></h3>
                    <p th:text="${problem.shortDescription}"></p>
                </a>
            </div>
            <div th:if="${#lists.isEmpty(results)}" class="no-results">
                <p>No algorithms found for "<span th:text="${query}"></span>"</p>
                
                <div style="margin-top: 30px;">
                    <h3>Try AI Fallback</h3>
                    <p>Let Groq generate a solution for this problem.</p>
                    <form action="/ai-solution" method="get">
                        <input type="hidden" name="problem" th:value="${query}">
                        <button type="submit" class="execute-btn">Get AI Solution</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="/js/app.js" th:src="@{/js/app.js}"></script>
    <script src="/js/voice.js"></script>
</body>
</html>
