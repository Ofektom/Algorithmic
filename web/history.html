<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Algorithmic: ask a coding problem by voice or text and see its Java solution">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Algorithmic">
    <title>History · Algorithmic</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <meta name="theme-color" content="#4c5bd4">
    <link rel="preconnect" href="https://algorithmicx.onrender.com" crossorigin>
    <!-- Apply the saved theme before first paint so dark mode doesn't flash white -->
    <script>
        try {
            var t = localStorage.getItem('algo.theme');
            if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        } catch (e) { /* storage unavailable */ }
    </script>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body data-nav="history">
<main class="page">
    <div class="appbar">
        <h1>History</h1>
        <button type="button" class="chip" id="clearHistory" hidden>Clear</button>
    </div>
    <p class="small muted" style="margin-bottom:12px">Problems you opened and questions you asked, saved in this browser only.</p>
    <div class="list" id="historyList"></div>
    <div class="empty" id="historyEmpty" hidden>
        <p class="t">Nothing here yet</p>
        <p>Tap Ask and say a problem, or browse the categories.</p>
    </div>
</main>

<script src="/js/config.js"></script>
<script src="/js/app.js"></script>
<script src="/js/voice.js"></script>
<script src="/js/pages/history.js"></script>
</body>
</html>
